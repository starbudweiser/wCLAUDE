<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title></title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { height: 100%; }
  body { display: grid; place-items: center; background: var(--bg); }
  .card { width: min(720px, calc(100% - 56px)); padding: var(--space-6); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; font: 700 22px/28px var(--font-sans); letter-spacing: .025em; color: var(--text-strong); }
  .w { color: #d97757; }
  p { margin: 0; color: var(--text-muted); max-width: 520px; }
</style>
</head>
<body>
<div class="card">
  <img src="icon.png" alt="">
  <h1><span class="w">w</span>CLAUDE</h1>
  <p id="d"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('d').textContent = q.get('d') || '';
  document.title = q.get('t') || '';
</script>
</body>
</html>
